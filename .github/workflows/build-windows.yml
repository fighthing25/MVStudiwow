name: Build Windows Offline App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS deps
        run: npm install

      - name: Build Web (dist)
        run: npm run build

      - name: Init Tauri if missing
        shell: pwsh
        run: |
          if (-Not (Test-Path "src-tauri")) {
            Write-Host "src-tauri not found, creating..."
            cargo install tauri-cli --version "^2.0.0" --locked
            cargo tauri init --app-name MVStudiwow --window-title "MVStudiwow Offline" --dist-dir ../dist --dev-path http://localhost:5173 --before-dev-command "npm run dev" --before-build-command "npm run build" --ci
          } else {
            Write-Host "src-tauri exists"
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Patch tauri.conf.json to use dist
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          if (Test-Path $confPath) {
            (Get-Content $confPath) -replace '"distDir":.*', '"distDir": "../dist",' | Set-Content $confPath
            Write-Host "Patched distDir"
          }

      - name: Build EXE
        run: cargo tauri build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MVStudiwow-Windows-Offline
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/*.exe
