name: Build Windows Offline App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Create Electron files
        shell: pwsh
        run: |
          @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({ width: 1280, height: 800 });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }
          app.whenReady().then(createWindow);
          "@ | Set-Content -Path main.js

          @"
          appId: com.mvstudiwow.app
          productName: MVStudiwow
          directories:
            output: release
            buildResources: build
          files:
            - dist/**/*
            - main.js
            - package.json
          win:
            target: nsis
            icon: build/icon.ico
          nsis:
            oneClick: false
            allowToChangeInstallationDirectory: true
          "@ | Set-Content -Path electron-builder.yml

          New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Build EXE
        run: |
          npm install --save-dev electron electron-builder
          npx electron-builder --config electron-builder.yml --win --x64

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MVStudiwow-EXE
          path: release/*.exe
