name: Build Windows Offline App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Web (dist)
        run: npm run build

      - name: Create Electron Main File
        shell: pwsh
        run: |
          @"
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@ | Out-File -Encoding utf8 main.js

          @"
          {
            "name": "mvstudiwow",
            "version": "1.0.0",
            "main": "main.js",
            "build": {
              "appId": "com.mvstudiwow.app",
              "productName": "MVStudiwow",
              "files": ["dist/**/*", "main.js", "package.json"],
              "win": { "target": "nsis" }
            }
          }
          "@ | Out-File -Encoding utf8 electron-package.json

      - name: Install Electron Builder
        run: |
          npm install --save-dev electron electron-builder
          $pkg = Get-Content package.json | ConvertFrom-Json
          $electron = Get-Content electron-package.json | ConvertFrom-Json
          $pkg.main = $electron.main
          $pkg.build = $electron.build
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
        shell: pwsh

      - name: Build EXE
        run: npx electron-builder --win --x64

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MVStudiwow-Windows-Offline
          path: dist/*.exe
          
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: MVStudiwow-Installer
          path: dist_electron/**/*.exe
          if-no-files-found: warn
