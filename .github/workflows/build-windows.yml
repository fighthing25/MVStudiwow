name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build web
        run: npm run build

      - name: Build EXE
        run: |
          npm install -D electron electron-builder
          npm run electron:build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MVStudiwow-EXE
          path: release/*.exe
